name: One-time authorized Timeweb technical domain setup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/timeweb-add-free-domain.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-free-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Safely add only family-habits-auth-test.tw1.ru
        env:
          TIMEWEB_API_TOKEN: ${{ secrets.TIMEWEB_API_TOKEN }}
        run: python3 tools/timeweb_add_test_domain.py
